# Offline/local portfolio only; binds PostgreSQL to localhost, never 0.0.0.0.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: project07
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${P07_DB_PASSWORD:-portfolio_dev_only}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d project07"]
      interval: 5s
      timeout: 3s
      retries: 20
  dbt:
    build:
      context: ./dbt-runtime
    environment:
      P07_DB_HOST: postgres
      P07_DB_PORT: "5432"
      P07_DB_NAME: project07
      P07_DB_USER: portfolio
      P07_DB_PASSWORD: ${P07_DB_PASSWORD:-portfolio_dev_only}
      DBT_TARGET_PATH: /out/dbt_target
      DBT_LOG_PATH: /out/dbt_logs
      P07_OUTPUT: /out
    working_dir: /workspace/warehouse
    volumes:
      - ../:/workspace:ro
      - ./artifacts:/out
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]
volumes:
  pgdata:
